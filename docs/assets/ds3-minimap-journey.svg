<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">A visible record of the journey</title>
  <desc id="description">An animated Dark Souls inspired minimap with a moving player, appearing breadcrumbs, a flickering bonfire and a glowing item wisp.</desc>
  <defs>
    <radialGradient id="background" cx="46%" cy="42%" r="72%">
      <stop offset="0" stop-color="#29251f"/><stop offset=".62" stop-color="#121416"/><stop offset="1" stop-color="#070809"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d6c59f"/><stop offset=".52" stop-color="#91866d"/><stop offset="1" stop-color="#5e5a4e"/>
    </linearGradient>
    <radialGradient id="fireGlow"><stop stop-color="#ffd78f" stop-opacity=".85"/><stop offset=".35" stop-color="#e8782f" stop-opacity=".32"/><stop offset="1" stop-color="#e24c1f" stop-opacity="0"/></radialGradient>
    <radialGradient id="wispGlow"><stop stop-color="#fff" stop-opacity=".95"/><stop offset=".32" stop-color="#bde8ff" stop-opacity=".42"/><stop offset="1" stop-color="#74c7f4" stop-opacity="0"/></radialGradient>
    <filter id="clouds" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".012 .018" numOctaves="4" seed="29" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="grey"/>
      <feComponentTransfer in="grey" result="soft"><feFuncA type="linear" slope=".3"/></feComponentTransfer>
      <feComposite in="soft" in2="SourceGraphic" operator="in" result="clipped"/>
      <feBlend in="SourceGraphic" in2="clipped" mode="soft-light"/>
    </filter>
    <filter id="softGlow" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="7"/></filter>
    <clipPath id="mapClip"><circle cx="600" cy="337.5" r="286"/></clipPath>
    <path id="route" d="M337 477 C390 432 423 465 466 414 S542 356 582 375 S650 347 688 286 S750 224 821 207"/>
    <g id="player-marker">
      <circle r="27" fill="#000" opacity=".58"/>
      <path d="M0-25 L17 19 0 10-17 19 Z" fill="#ffc95c" stroke="#0b0906" stroke-width="7" stroke-linejoin="round"/>
      <path d="M0-18 L0 7" stroke="#fff0bd" stroke-width="3" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="1200" height="675" fill="url(#background)"/>
  <circle cx="600" cy="337.5" r="298" fill="#050607" stroke="#060606" stroke-width="18"/>
  <circle cx="600" cy="337.5" r="290" fill="#111518" stroke="#9f8350" stroke-width="4"/>
  <g clip-path="url(#mapClip)">
    <rect x="300" y="40" width="600" height="595" fill="#1a1f21"/>
    <path d="M273 553 L301 415 350 363 398 355 431 295 512 284 546 220 613 190 669 210 714 172 860 167 920 270 857 329 780 347 739 419 650 421 602 471 543 464 483 526 399 516 353 573 Z" fill="url(#ground)" filter="url(#clouds)" stroke="#090a09" stroke-width="13" stroke-linejoin="round"/>
    <path d="M382 493 C420 438 465 447 490 402 S544 322 598 349 677 326 702 269 759 215 842 202" fill="none" stroke="#312d25" stroke-width="22" stroke-linecap="round" opacity=".58"/>
    <use class="route-dots" href="#route" fill="none" stroke="#86d3ff" stroke-width="8" stroke-linecap="round" stroke-dasharray="1 29" stroke-dashoffset="320" opacity=".95"/>
    <g transform="translate(334 486)">
      <circle r="48" fill="url(#fireGlow)" class="fire-aura"/>
      <path d="M-27 19 Q0 36 27 19 M-25 19 L13 3 M25 19 L-8 0" fill="none" stroke="#ff9a46" stroke-width="6" stroke-linecap="round"/>
      <path d="M-4 22 C-26 7-12-10-4-18 C-8-5 8-10 8-31 C27-9 18 12 4 23 Z" fill="#ef7d35" stroke="#160d07" stroke-width="6" class="flame"/>
      <path d="M1 16 C-8 5 3-2 2-15 C14-2 10 12 1 16 Z" fill="#ffe5a0"/>
      <path d="M10-38 L-2 24 M-10 0 L13 4" stroke="#ded1ad" stroke-width="5" stroke-linecap="round"/>
    </g>
    <g transform="translate(825 202)">
      <g class="wisp">
        <ellipse rx="48" ry="62" fill="url(#wispGlow)"/>
        <path d="M-8 23 C23 9-18-5 7-21 C21-30 9-40 1-48" fill="none" stroke="#d9f3ff" stroke-width="7" stroke-linecap="round"/>
        <circle cx="-8" cy="25" r="9" fill="#fff"/>
        <circle cx="20" cy="-15" r="4" fill="#d9f3ff"/><circle cx="-19" cy="-5" r="3" fill="#d9f3ff"/>
      </g>
    </g>
    <g class="player">
      <animateMotion dur="5.6s" repeatCount="indefinite" rotate="auto"><mpath href="#route"/></animateMotion>
      <use href="#player-marker"/>
    </g>
    <g class="static-player" transform="translate(337 477)"><use href="#player-marker"/></g>
  </g>
  <circle cx="600" cy="337.5" r="286" fill="none" stroke="#d1b476" stroke-opacity=".42" stroke-width="2"/>
  <path d="M600 43v22 M600 610v22 M306 337h22 M872 337h22" stroke="#b89a60" stroke-width="5" stroke-linecap="round"/>
  <text x="600" y="641" fill="#d8c9a8" font-family="Palatino Linotype, Georgia, serif" font-size="22" text-anchor="middle" letter-spacing="4">A VISIBLE RECORD OF THE JOURNEY</text>
  <style>
    .fire-aura{transform-box:fill-box;transform-origin:center;animation:pulse 1.25s ease-in-out infinite}
    .flame{transform-box:fill-box;transform-origin:center bottom;animation:flicker .42s ease-in-out infinite alternate}
    .wisp{transform-box:fill-box;transform-origin:center;animation:float 2.8s ease-in-out infinite}
    .route-dots{animation:trail 5.6s linear infinite}.static-player{display:none}
    @keyframes pulse{50%{transform:scale(1.14);opacity:.76}}
    @keyframes flicker{to{transform:scale(.94,1.11) skewX(2deg)}}
    @keyframes float{50%{transform:translateY(-9px);opacity:.82}}
    @keyframes trail{to{stroke-dashoffset:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.player{display:none}.static-player{display:block}}
  </style>
</svg>
